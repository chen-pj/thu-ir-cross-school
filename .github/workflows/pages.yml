# 發布到 GitHub Pages。刻意只允許手動觸發：
# 需先在 Settings → Pages 把 Source 設為 "GitHub Actions"，再到 Actions 頁按 Run workflow。
# 發布分支：claude/main（預設分支）。
name: Deploy dashboard to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build (含數值驗證、內部編號與外部請求檢查)
        run: python tools/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
