# 發布到 GitHub Pages：推送到 main 就自動發布；也可以到 Actions 頁按 Run workflow 手動重跑。
# 需先在 Settings → Pages 把 Source 設為 "GitHub Actions"。
# 建置時 build.py 會逐值驗證資料、檢查內部編號與外部請求，任何一項不通過就不會發布。
name: Deploy dashboard to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build (含數值驗證、內部編號與外部請求檢查)
        run: python tools/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
